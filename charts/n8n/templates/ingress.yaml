{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "n8n.ingName" . }}
  labels:
    app.kubernetes.io/name: {{ include "n8n.ingName" . }}
spec:
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ .Values.ingress.tls.secretName }}
      hosts:
        - {{ .Values.n8n.domain }}
  {{- end }}
  rules:
    - host: {{ .Values.n8n.domain }}
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: {{ include "n8n.svcName" . }}
                port:
                  number: {{ .Values.n8n.port }}
{{- end }}