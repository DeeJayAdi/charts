apiVersion: apps/v1
kind: Deployment
metadata: {{ $fullname := printf "%s-%s" .Release.Name .Chart.Name | trunc 63 | trimSuffix "-" }}
  name: {{ $fullname }}
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
spec:
  selector:
    matchLabels:
      app: {{ $fullname }}
  replicas: {{ default 1 .Values.config.replicaCount | int }}
  template:
    metadata:
      labels:
        app: {{ $fullname }}
    spec:
      securityContext:
        sysctls:
            - name: net.ipv4.ping_group_range
              value: "65532 65532"
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:{{ .Values.cloudflared.version }}
        imagePullPolicy: IfNotPresent
        env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cf-tunnel-secret
                  key: token
        command:
            - cloudflared
            - tunnel
            - --no-autoupdate
            - --loglevel
            - debug
            - --metrics
            - 0.0.0.0:2000
            - run
        livenessProbe:
            httpGet:
                path: /ready
                port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
        readinessProbe:
            httpGet:
                path: /ready
                port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10