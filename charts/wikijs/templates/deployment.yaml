apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wikijs.deployName" . }}
spec:
  replicas: {{ .Values.wikijs.replicas | default 3  }}
  selector:
    matchLabels:
      app: {{ include "wikijs.deployName" . }}
  template:
    metadata:
      labels:
        app: {{ include "wikijs.deployName" . }}
    spec:
      containers:
        - name: wikijs
          image: requarks/wiki:{{ .Chart.AppVersion }}
          resources: {}
          env:
            - name: DB_TYPE
              value: {{ .Values.wikijs.database.type | default "mariadb" }}
            - name: DB_HOST
              value: {{ .Values.wikijs.database.host }}
            - name: DB_PORT
              value: {{ .Values.wikijs.database.port | default "3306" | quote }}
            - name: DB_USER
              value: {{ .Values.wikijs.database.user | default "wikijs" }}
            - name: DB_PASS
              value: {{ .Values.wikijs.database.password | default "wikijs" | quote }}
            - name: DB_NAME
              value: {{ .Values.wikijs.database.name | default "wikijs" }}
          ports:
            - name: web
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 30