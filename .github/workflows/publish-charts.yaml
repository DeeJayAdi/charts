name: Publish helm charts

on:
    push:
        branches:
            - main
        paths:
            - "charts/**"

jobs:
    release-charts:
        permissions:
            actions: write
            contents: write
            pages: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Helm
              uses: azure/setup-helm@v3
              with:
                  version: v3.12.0

            - name: Lint and package all charts
              run: |
                  set -euo pipefail
                  charts=($(find charts -maxdepth 1 -mindepth 1 -type d -exec basename {} \;))
                  mkdir -p packaged
                  for c in "${charts[@]}"; do
                      echo "== Linting $c =="
                      helm lint "charts/$c"
                      echo "== Packaging $c =="
                      helm package "charts/$c" --destination packaged/
                  done

            - name: Create Helm repo index
              run: |
                  helm repo index packaged --url https://charts.iocode.dev/

            - name: Add CNAME for custom domain
              run: |
                  echo "charts.iocode.dev" > packaged/CNAME

            - name: Publish packaged charts to gh-pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: packaged
                  publish_branch: gh-pages
